<button id="sidebar-toggle" aria-label="打开信息栏" aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>

<div id="sidebar-scrim"></div>

<aside id="sidebar">
  <button id="sidebar-collapse" aria-label="收起信息栏">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
    </svg>
  </button>
  <div id="sidebar-header">
    <img src="{{ site.data.author.dp }}" alt="Avatar missing" id="sidebar-avatar" />
    <a id="sidebar-site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <div id="sidebar-text">{{ site.data.author.description }}</div>
  </div>

  <nav id="sidebar-nav-links">
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="{{ site.baseurl }}/tags">Tags</a>
    <a href="{{ site.baseurl }}/posts/关于本站/">Info</a>
    <a href="{{ site.baseurl }}/posts/链接/">Links</a>
  </nav>

  <nav id="sidebar-social-links">
    {% for i in site.data.author.contact %}
    <a href="{{ i.url }}" target="_blank" aria-label="{{ i.title }}">
      <img src="{{ site.baseurl }}/assets/icons/{{ i.title }}.svg" alt="{{ i.title }}" />
    </a>
    {% endfor %}
  </nav>
  <div id="theme-toggle">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </div>
</aside>
